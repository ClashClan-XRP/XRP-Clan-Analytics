name: Suggestion
description: Propose a change for XRP Clan Analytics
title: "[suggestion] "
labels: ["feedback", "suggestion"]
body:
  - type: textarea
    id: message
    attributes:
      label: Suggestion
      description: What should we add or change?
      placeholder: I want the clan roster to…
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Your name (optional)
      placeholder: Clan tag or in-game name
